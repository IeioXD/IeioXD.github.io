<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control Bluetooth ESP32</title>
    <!-- Tailwind CSS CDN para un diseño moderno y responsive -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Fuente Inter */
        body { font-family: 'Inter', sans-serif; background-color: #0d1117; color: #e6edf3; }
        /* Estilos específicos para el joystick y botones */
        .joystick-container {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background-color: #21262d;
            border: 4px solid #30363d;
            position: relative;
            touch-action: none; /* Deshabilita el scroll táctil */
            box-shadow: 0 0 10px rgba(0, 200, 255, 0.4);
        }
        .joystick-handle {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: #58a6ff;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 8px rgba(0, 200, 255, 0.8);
            cursor: grab;
        }
        .btn-control {
            transition: all 0.1s ease;
            box-shadow: 0 4px #0f62ab;
        }
        .btn-control:active {
            box-shadow: 0 0 #0f62ab;
            transform: translateY(4px);
        }
    </style>
</head>
<body class="p-4 flex flex-col items-center min-h-screen">

    <header class="w-full max-w-lg mb-6">
        <h1 class="text-3xl font-bold text-center text-[#58a6ff]">ESP32 RC Control</h1>
        <p id="status" class="text-center mt-2 text-sm text-yellow-300">Desconectado. Presiona CONECTAR.</p>
    </header>

    <!-- Botón de Conexión -->
    <button id="connectBtn" class="w-full max-w-xs py-3 rounded-lg font-semibold bg-[#238636] hover:bg-[#34a853] transition-colors mb-8">
        CONECTAR BLUETOOTH
    </button>

    <div class="flex flex-col items-center space-y-8 w-full max-w-lg">
        
        <!-- Joystick de Control de Velocidad y Dirección -->
        <div class="flex flex-col items-center">
            <h2 class="text-xl font-semibold mb-3 text-[#c9d1d9]">Velocidad y Dirección</h2>
            <div id="joystick" class="joystick-container">
                <div id="joystickHandle" class="joystick-handle"></div>
            </div>
            <p id="coords" class="mt-4 text-xs text-gray-400">Y: 0, X: 0</p>
        </div>

        <!-- Botones de Acción (Opcionales, para comandos fijos) -->
        <div class="flex flex-col items-center">
            <h2 class="text-xl font-semibold mb-3 text-[#c9d1d9]">Comandos Fijos</h2>
            <div class="flex space-x-4">
                <button id="stopBtn" class="btn-control bg-red-600 hover:bg-red-700 text-white font-bold py-2 px-6 rounded-lg">PARAR (S0)</button>
                <button id="maxBtn" class="btn-control bg-yellow-600 hover:bg-yellow-700 text-white font-bold py-2 px-6 rounded-lg">MAX (F255)</button>
            </div>
        </div>
    </div>

    <script>
        // --- CONFIGURACIÓN BLUETOOTH (Debes coincidir con tu código ESP32) ---
        // UUID del Servicio BLE (Ejemplo: Serial Port Profile)
        const SERVICE_UUID = '4fafc201-1fb5-459e-8ac2-ceb537a90000';
        // UUID de la Característica de Escritura (Donde se enviarán los comandos)
        const CHARACTERISTIC_UUID = 'beb5483e-36e1-4688-b7f5-ea07361b26a8';
        
        // Configuración de Joystick
        const MAX_RANGE = 75; // Máximo movimiento del joystick en píxeles
        // CAMBIO: Resolución de 8 bits para el ESP32 (0 a 255)
        const PWM_MAX = 255; 

        // Variables de estado
        let bluetoothDevice;
        let controlCharacteristic;
        let connectionStatus = document.getElementById('status');
        let isMoving = false; // Bandera para saber si el joystick se está arrastrando

        // Elementos DOM
        const connectBtn = document.getElementById('connectBtn');
        const joystick = document.getElementById('joystick');
        const handle = document.getElementById('joystickHandle');
        const coordsDisplay = document.getElementById('coords');
        
        // --- LÓGICA DE CONEXIÓN BLUETOOTH ---

        // Función para enviar datos al ESP32
        async function sendCommand(command) {
            if (!controlCharacteristic) {
                console.error("Característica no disponible. No conectado.");
                connectionStatus.textContent = "Error: Desconectado o Característica no disponible.";
                return;
            }
            try {
                // El comando es una cadena (ej. "F255")
                const data = new TextEncoder().encode(command + '\n');
                await controlCharacteristic.writeValue(data);
                console.log(`Enviado: ${command}`);
            } catch (error) {
                console.error(`Error al enviar comando: ${error.message}`);
                connectionStatus.textContent = `Error de envío: ${error.message}`;
            }
        }

        // Función para conectar el dispositivo
        async function connect() {
            if (!navigator.bluetooth) {
                alert('Tu navegador no soporta Web Bluetooth. Usa Chrome en Android.');
                return;
            }

            try {
                connectionStatus.textContent = 'Buscando dispositivo...';
                
                // 1. Solicitar el dispositivo
                bluetoothDevice = await navigator.bluetooth.requestDevice({
                    filters: [{ services: [SERVICE_UUID] }],
                });
                
                connectionStatus.textContent = `Conectando a ${bluetoothDevice.name || 'Dispositivo Desconocido'}...`;

                // 2. Conectar al GATT Server
                const server = await bluetoothDevice.gatt.connect();

                // 3. Obtener el servicio
                const service = await server.getPrimaryService(SERVICE_UUID);

                // 4. Obtener la característica de escritura
                controlCharacteristic = await service.getCharacteristic(CHARACTERISTIC_UUID);

                connectionStatus.textContent = `¡Conectado a ${bluetoothDevice.name}!`;
                connectionStatus.classList.remove('text-yellow-300');
                connectionStatus.classList.add('text-green-500');
                connectBtn.textContent = 'DESCONECTAR';
                connectBtn.onclick = disconnect;

            } catch (error) {
                console.error('Fallo en la conexión Bluetooth:', error);
                connectionStatus.textContent = `Fallo al conectar: ${error.message}.`;
                connectionStatus.classList.remove('text-green-500');
                connectionStatus.classList.add('text-red-500');
            }
        }

        // Función para desconectar
        function disconnect() {
            if (bluetoothDevice && bluetoothDevice.gatt.connected) {
                bluetoothDevice.gatt.disconnect();
            }
            controlCharacteristic = null;
            bluetoothDevice = null;
            connectionStatus.textContent = 'Desconectado. Presiona CONECTAR.';
            connectionStatus.classList.remove('text-green-500', 'text-red-500');
            connectionStatus.classList.add('text-yellow-300');
            connectBtn.textContent = 'CONECTAR BLUETOOTH';
            connectBtn.onclick = connect;
        }

        // --- LÓGICA DEL JOYSTICK ---

        // Mapea un valor de un rango a otro (como la función map() de Arduino)
        function mapValue(value, inMin, inMax, outMin, outMax) {
            return (value - inMin) * (outMax - outMin) / (inMax - inMin) + outMin;
        }

        // Convierte las coordenadas del joystick a un comando PWM
        function coordsToCommand(x, y) {
            // Y: Controla Velocidad y Dirección (F/B)
            // Mapea la posición Y (-MAX_RANGE a MAX_RANGE) al rango PWM (0 a PWM_MAX)
            let speed = Math.round(mapValue(Math.abs(y), 0, MAX_RANGE, 0, PWM_MAX));
            
            // Define la dirección F (Forward) o B (Backward)
            let direction = y < 0 ? 'F' : 'B';

            // Si está cerca del centro, se considera Parado (S0)
            if (speed < 10) { // Reduje el deadzone para 8 bits (antes 50 para 1023)
                speed = 0;
                direction = 'S';
            }
            
            // El comando debe ser: [F/B/S][VELOCIDAD]
            return `${direction}${speed}`;
        }

        // Inicia el movimiento del joystick
        function startMove(e) {
            if (!controlCharacteristic) {
                connectionStatus.textContent = '¡Primero conéctate al ESP32!';
                return;
            }
            isMoving = true;
            e.preventDefault();
        }

        // Actualiza la posición y envía el comando
        function moveHandle(e) {
            if (!isMoving) return;

            // Obtiene coordenadas (maneja toque o ratón)
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            
            const rect = joystick.getBoundingClientRect();
            
            // Calcula las coordenadas relativas al centro del joystick
            let x = clientX - (rect.left + rect.width / 2);
            let y = clientY - (rect.top + rect.height / 2);

            // Limita el movimiento al círculo (MAX_RANGE)
            const distance = Math.sqrt(x * x + y * y);
            if (distance > MAX_RANGE) {
                const angle = Math.atan2(y, x);
                x = Math.cos(angle) * MAX_RANGE;
                y = Math.sin(angle) * MAX_RANGE;
            }

            // Mueve el handle
            handle.style.left = `${x + rect.width / 2}px`;
            handle.style.top = `${y + rect.height / 2}px`;

            // Genera y envía el comando
            const command = coordsToCommand(x, y);
            coordsDisplay.textContent = `Y: ${y.toFixed(0)}, X: ${x.toFixed(0)} -> CMD: ${command}`;
            sendCommand(command);
        }

        // Detiene el movimiento y centra el joystick (Parar)
        function stopMove() {
            if (isMoving) {
                isMoving = false;
                // Vuelve el handle al centro
                handle.style.left = '50%';
                handle.style.top = '50%';
                
                // Envía el comando de PARAR (S0)
                const command = coordsToCommand(0, 0);
                coordsDisplay.textContent = `Y: 0, X: 0 -> CMD: ${command}`;
                sendCommand(command);
            }
        }

        // --- Event Listeners ---
        connectBtn.addEventListener('click', connect);

        // Control de Joystick (Mouse y Táctil)
        handle.addEventListener('mousedown', startMove);
        joystick.addEventListener('touchstart', startMove);
        document.addEventListener('mousemove', moveHandle);
        document.addEventListener('touchmove', moveHandle);
        document.addEventListener('mouseup', stopMove);
        document.addEventListener('touchend', stopMove);

        // Control de Botones Fijos
        document.getElementById('stopBtn').addEventListener('click', () => sendCommand('S0'));
        document.getElementById('maxBtn').addEventListener('click', () => sendCommand('F255'));


        // Inicializar
        document.addEventListener('DOMContentLoaded', () => {
             // Verificar la API al cargar
            if (!navigator.bluetooth) {
                connectionStatus.textContent = 'Error: Web Bluetooth no soportado en este dispositivo/navegador.';
                connectBtn.disabled = true;
                connectBtn.classList.remove('bg-[#238636]');
                connectBtn.classList.add('bg-red-900');
            }
        });
    </script>

</body>
</html>
